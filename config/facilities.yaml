# VeriCEMS Reproducible EPA CAMPD Facility Selection Manifest
# Source: Official US EPA Clean Air Markets Program Data (CAMPD) 40 CFR Part 75 Bulk Data Files
# Portal: https://campd.epa.gov/data/bulk-data-files
# Bulk File Base URL: https://api.epa.gov/easey/bulk-files
#
# Deterministic Selection Methodology:
# 1. Calendar Year: 2025 (2025-01-01 through 2025-12-31, most recent complete calendar year in EPA CAMPD).
# 2. Geographic Scope: Three compact US states with mixed coal and natural-gas Part 75 fleets:
#    Iowa (IA), Utah (UT), and Wyoming (WY). This keeps raw bulk downloads minimal (only 3 state CSVs)
#    while providing a rich pool of baseload and cycling coal and natural-gas units.
# 3. Fuel Filter: Units reporting Primary Fuel Type in ["Coal", "Pipeline Natural Gas", "Natural Gas"].
# 4. Activity Filter & Balanced Ranking: Across IA, UT, and WY, each facility is classified by its dominant
#    fuel category (Coal vs. Natural Gas) based on 2025 operating unit-hours (Operating Time > 0), restricted
#    to facilities with >= 1,000 operating unit-hours in 2025. We deterministically select the top 15 Coal
#    facilities and top 15 Natural Gas facilities ranked by 2025 operating unit-hours descending (tie-broken
#    by Facility ID ascending), yielding 30 facilities total.

schema_version: "1.0.0"
calendar_year: 2025
source_portal_url: "https://campd.epa.gov/data/bulk-data-files"
bulk_files_base_url: "https://api.epa.gov/easey/bulk-files"
bulk_manifest_url: "https://api.epa.gov/easey/camd-services/bulk-files"
states:
  - "IA"
  - "UT"
  - "WY"
allowed_primary_fuels:
  - "Coal"
  - "Pipeline Natural Gas"
  - "Natural Gas"
selection_rule: "Top 15 Coal-dominant and top 15 Natural-Gas-dominant Part 75 facilities across IA, UT, and WY ranked by 2025 operating unit-hours (Operating Time > 0, minimum 1,000 operating unit-hours)."
