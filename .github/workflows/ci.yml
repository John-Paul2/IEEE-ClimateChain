name: VeriCEMS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  honesty-lint:
    name: Honesty & Provenance Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Honesty & Provenance Linter
        run: |
          python scripts/honesty_lint.py

      - name: Monorepo Syntax Check
        run: |
          python -m py_compile ml/train.py ml/benchmark/run_benchmark.py

  python-tests:
    name: Backend & ML Tests
    runs-on: ubuntu-latest
    needs: honesty-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest
        run: |
          python -m pytest -q

  contracts-tests:
    name: Foundry Solidity Tests
    runs-on: ubuntu-latest
    needs: honesty-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge Tests
        run: |
          forge test -vv --root contracts

  web-tests:
    name: Web Frontend & Verification Tests
    runs-on: ubuntu-latest
    needs: honesty-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix web ci

      - name: Run Unit Tests
        run: |
          npm --prefix web run test:unit

      - name: Build Web Application
        run: |
          npm --prefix web run build
