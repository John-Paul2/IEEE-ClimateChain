[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
    { access = "read", path = "../schemas/golden" },
    { access = "read", path = "../config" },
    { access = "read-write", path = "../deployments" },
    { access = "read-write", path = "./" }
]

[fuzz]
runs = 256
seed = "0x5665726943454d53"

[invariant]
runs = 64
depth = 32
fail_on_revert = false
